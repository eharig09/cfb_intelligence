services:
  - type: web
    name: cfb_intelligence
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # These pages are CPU-bound, so a second thread adds concurrent memory
    # pressure without useful throughput. Disk-backed page caching makes repeat
    # requests cheap while leaving maximum headroom for refresh subprocesses.
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --max-requests 500 --max-requests-jitter 50 run:app
    healthCheckPath: /api/v1/cfb/status
    envVars:
      - key: REGISTER_LEGACY_DASHBOARDS
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CFB_REFRESH_CHILD_MB
        value: "320"
      - key: CFB_PAGE_CACHE_SECONDS
        value: "900"
      - key: CFB_PAGE_CACHE_DIR
        value: /var/data/page_cache
      - key: CFB_PAGE_CACHE_THRESHOLD
        value: "150"
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
      - key: CFB_REFRESH_HOURS
        value: 6,12,18,23
      - key: CFB_REFRESH_HEAVY_HOURS
        value: 6,23
      # Local reporting is deliberately decoupled from light/heavy refreshes.
      # Each news run processes one persisted shard and exits.
      - key: CFB_REFRESH_NEWS_HOURS
        value: 8,10,14,16,20,22
      - key: CFB_LOCAL_NEWS_SHARD_SIZE
        value: "50"
      - key: CFB_DATABASE_PATH
        value: /var/data/cfb.sqlite3
      - key: CFBD_RAW_CACHE_PATH
        value: /var/data/cfbd_raw
      - key: SPORTSDATAVERSE_CACHE_PATH
        value: /var/data/sportsdataverse
      - key: CFB_WEATHER_CACHE_PATH
        value: /var/data/weather
      - key: CFB_REFRESH_TOKEN
        sync: false
    disk:
      name: cfb-data
      mountPath: /var/data
      sizeGB: 5

  - type: cron
    name: cfb-refresh-trigger
    runtime: python
    # Auto decides on the web service: 15-minute score pulses while games are
    # active, hourly result/box-score passes, and one-shot scheduled jobs.
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sports_aggregator.render_trigger
    envVars:
      - key: CFB_REFRESH_URL
        sync: false
      - key: CFB_REFRESH_TOKEN
        sync: false
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
