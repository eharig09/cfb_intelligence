services:
  - type: web
    name: cfb_intelligence
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # Two threads, not four. Pages here are large -- a team page renders over
    # 500 KB and holds the packets behind it while it does -- so peak memory
    # scales with concurrent renders, and the refresh subprocess has to fit
    # alongside them in the same 512 MB.
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --max-requests 500 --max-requests-jitter 50 run:app
    healthCheckPath: /api/v1/cfb/status
    envVars:
      - key: REGISTER_LEGACY_DASHBOARDS
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Address-space ceiling for each refresh subprocess. A step that exceeds
      # it fails on its own instead of taking the instance down.
      - key: CFB_REFRESH_CHILD_MB
        value: "320"
      # Rendered pages are cached against the database's modification time, so
      # a refresh invalidates them without needing to signal the web worker.
      # This is a backstop lifetime; set to 0 to disable page caching.
      - key: CFB_PAGE_CACHE_SECONDS
        value: "900"
      # The refresh schedule lives here, not in the cron service. The cron
      # container has no disk -- the database mounts to this service alone --
      # so it cannot see whether a game is being played, and that is the thing
      # the schedule now turns on.
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
      - key: CFB_REFRESH_HOURS
        value: 6,12,18,23
      - key: CFB_REFRESH_HEAVY_HOURS
        value: 6,23
      - key: CFB_DATABASE_PATH
        value: /var/data/cfb.sqlite3
      - key: CFBD_RAW_CACHE_PATH
        value: /var/data/cfbd_raw
      - key: SPORTSDATAVERSE_CACHE_PATH
        value: /var/data/sportsdataverse
      - key: CFB_WEATHER_CACHE_PATH
        value: /var/data/weather
      - key: CFB_REFRESH_TOKEN
        sync: false
    disk:
      name: cfb-data
      mountPath: /var/data
      sizeGB: 5

  - type: cron
    name: cfb-refresh-trigger
    runtime: python
    # Every quarter hour. Most firings ask the web service what this moment
    # calls for, are told "nothing", and exit in about a second. The ones
    # during a game slate get a five-second pass that syncs the scores and the
    # market, which is what a score appearing when it happens costs.
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sports_aggregator.render_trigger
    envVars:
      - key: CFB_REFRESH_URL
        sync: false
      - key: CFB_REFRESH_TOKEN
        sync: false
      # Only for the timestamp in this job's own log; the decision is made by
      # the web service, which reads its own copy of this setting.
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
