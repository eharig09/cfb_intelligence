services:
  - type: web
    name: cfb_intelligence
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker/thread leaves the most headroom on the constrained web service.
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --max-requests 500 --max-requests-jitter 50 run:app
    healthCheckPath: /api/v1/cfb/status
    envVars:
      - key: REGISTER_LEGACY_DASHBOARDS
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CFB_REFRESH_CHILD_MB
        value: "200"
      - key: CFB_PAGE_CACHE_SECONDS
        value: "900"
      - key: CFB_PAGE_CACHE_DIR
        value: /var/data/page_cache
      - key: CFB_PAGE_CACHE_THRESHOLD
        value: "150"
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
      - key: CFB_REFRESH_HOURS
        value: 2,4,6,10,12,16,18,22,23
      - key: CFB_REFRESH_HEAVY_HOURS
        value: ""
      - key: CFB_REFRESH_CORE_HOURS
        value: 6,18
      - key: CFB_REFRESH_CONTENT_HOURS
        value: 2,4,10,16
      - key: CFB_REFRESH_ROSTER_HOURS
        value: "12"
      - key: CFB_REFRESH_STATS_HOURS
        value: "22"
      - key: CFB_REFRESH_MODEL_HOURS
        value: "23"
      - key: CFB_REFRESH_NEWS_HOURS
        value: 1,3,5,8,14,20
      - key: CFB_LOCAL_NEWS_SHARD_SIZE
        value: "25"
      - key: CFB_DATABASE_PATH
        value: /var/data/cfb.sqlite3
      - key: CFBD_RAW_CACHE_PATH
        value: /var/data/cfbd_raw
      - key: SPORTSDATAVERSE_CACHE_PATH
        value: /var/data/sportsdataverse
      - key: CFB_WEATHER_CACHE_PATH
        value: /var/data/weather
      - key: CFB_REFRESH_TOKEN
        sync: false
      # Human admin actions can use a short PIN instead of exposing the refresh
      # token. Set this once in Render; the browser remembers it locally.
      - key: CFB_ADMIN_PIN
        sync: false
    disk:
      name: cfb-data
      mountPath: /var/data
      sizeGB: 5

  - type: cron
    name: cfb-refresh-trigger
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sports_aggregator.render_trigger
    envVars:
      - key: CFB_REFRESH_URL
        sync: false
      - key: CFB_REFRESH_TOKEN
        sync: false
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
